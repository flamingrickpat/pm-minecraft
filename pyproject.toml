[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pm-minecraft-mcp"
version = "0.1.0"
description = "A self-contained Mineflayer Minecraft body and MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==3.4.4",
    "filelock>=3.14,<4",
    "pydantic>=2.9,<3",
    "requests>=2.32,<3",
    "ruamel-yaml>=0.18,<1",
]

[project.scripts]
pm-minecraft-mcp = "pm_minecraft_mcp.minecraft_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["pm_minecraft_mcp"]
artifacts = ["pm_minecraft_mcp/node/**", "pm_minecraft_mcp/drafts/**"]

# Copies the Node runtime assets (body sources, web UI, patches, lockfiles)
# and the example drafts into the package so an installed wheel can bootstrap
# itself; see hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"pm_minecraft_mcp/minecraft_mcp.py" = ["E501"]
